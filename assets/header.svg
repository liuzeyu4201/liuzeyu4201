    <rect x="1" y="1" width="1118" height="42" fill="#12171e"/>
    <rect x="0" y="42" width="1120" height="1" fill="#30363d"/>
    <rect x="0" y="42" width="1120" height="70" fill="url(#scan)"/>
  </g>

  <rect x="1" y="1" width="1118" height="298" rx="14" fill="none" stroke="#30363d" stroke-width="1.5"/>

  <circle cx="28" cy="22" r="6" fill="#ff5f56"/>
  <circle cx="50" cy="22" r="6" fill="#ffbd2e"/>
  <circle cx="72" cy="22" r="6" fill="#27c93f"/>
  <text x="560" y="26" text-anchor="middle" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="13">zeyu@surfin: ~/betterbuddy — zsh</text>

