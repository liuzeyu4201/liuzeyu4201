<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="300" viewBox="0 0 1120 300" role="img" aria-label="Liu Zeyu — AI Engineer at Surfin, building BetterBuddy">
  <defs>
    <clipPath id="win">
      <rect x="1" y="1" width="1118" height="298" rx="14"/>
    </clipPath>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#15202b" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7ee787" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#79c0ff" stop-opacity="0.00"/>
